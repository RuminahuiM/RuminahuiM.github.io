site_name: Dodoe Rumiñahui Mannale
site_description: "Portfolio: Semesterarbeiten und Projekte von Dodoe Rumiñahui Mannale"
site_author: Dodoe Rumiñahui Mannale
site_url: https://ruminahuim.github.io/
repo_url: https://github.com/RuminahuiM/RuminahuiM.github.io
repo_name: RuminahuiM/RuminahuiM.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/brand/logo.svg
  favicon: assets/brand/logo.svg
  language: de
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Helles Design

# Kontaktlinks: erscheinen auf Startseite, Über mich und Lebenslauf (Platzhalter <!-- kontakt -->).
# Eintrag mit url (Link) oder mail (E-Mail-Adresse). Leere Werte werden ausgeblendet. Reihenfolge hier = Reihenfolge auf der Seite.
extra:
  kontakt:
    - name: LinkedIn
      url: https://www.linkedin.com/in/dodoe-mannale/
    - name: E-Mail
      mail: dodoe.mannale@ruminahui.ch  # erscheint nie im Klartext im HTML (siehe README)
      en:
        name: Email
    - name: GitHub
      url: https://github.com/RuminahuiM

extra_css:
  - assets/brand/palette.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/kontakt.js

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search:
      lang: de
  # Zweisprachig: Seite.md = Deutsch, Seite.en.md = Englisch (siehe README, "Sprachen").
  # Englisch liegt unter /en/. Fehlt eine .en.md, erscheint dort die deutsche Seite.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: "Portfolio: semester projects and other projects by Dodoe Rumiñahui Mannale"
          nav_translations:
            Start: Home
            Semesterarbeiten: Semester projects
            Weitere Projekte: Other projects
            Lebenslauf: CV
            Über mich: About me
          theme:
            palette:
              - toggle:
                  name: Switch to dark mode
              - toggle:
                  name: Switch to light mode

# Rendert die Projektliste aus data/projects.yml in die Seiten (siehe README).
# Fuegt "Weitere Projekte" automatisch in die Navigation ein, sobald es dort Eintraege gibt.
hooks:
  - hooks/projects.py

validation:
  links:
    anchors: warn

# Die Seite ist erst in der Navigation, wenn es Eintraege gibt (macht der Hook).
not_in_nav: |
  /weitere-projekte*.md

nav:
  - Start: index.md
  - Semesterarbeiten: semesterarbeiten.md
  - Lebenslauf: cv.md
  - Über mich: ueber-mich.md
