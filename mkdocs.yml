site_name: Dodoe Rumiñahui Mannale
site_description: "Portfolio von Dodoe Rumiñahui Mannale, System Engineer in Zürich: Semesterarbeiten aus dem Studium dipl. Informatiker HF, Lebenslauf und eigene Projekte zu Automatisierung, Cloud und AI."
site_author: Dodoe Rumiñahui Mannale
site_url: https://ruminahuim.github.io/
repo_url: https://github.com/RuminahuiM/RuminahuiM.github.io
repo_name: RuminahuiM/RuminahuiM.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides   # eigene Kopfzeile und Seitenvorlagen (siehe README, "Design")
  font: false             # Schrift Inter wird in overrides/main.html geladen
  logo: assets/brand/logo.svg
  favicon: assets/brand/logo.svg
  language: de
  features:
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Helles Design

# Kontaktlinks: erscheinen auf Startseite und Lebenslauf (Platzhalter <!-- kontakt -->).
# Eintrag mit url (Link) oder mail (E-Mail-Adresse). Leere Werte werden ausgeblendet. Reihenfolge hier = Reihenfolge auf der Seite.
extra:
  kontakt:
    - name: LinkedIn
      url: https://www.linkedin.com/in/dodoe-mannale/
    - name: E-Mail
      mail: dodoe.mannale@ruminahui.ch  # erscheint nie im Klartext im HTML (siehe README)
      en:
        name: Email
    - name: GitHub
      url: https://github.com/RuminahuiM

extra_css:
  - assets/brand/palette.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/kontakt.js
  - javascripts/projekte.js
  - javascripts/cv.js

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc
  - pymdownx.details
  - pymdownx.superfences

plugins:
  # Zweisprachig: Seite.md = Deutsch, Seite.en.md = Englisch (siehe README, "Sprachen").
  # Englisch liegt unter /en/. Fehlt eine .en.md, erscheint dort die deutsche Seite.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: "Portfolio of Dodoe Rumiñahui Mannale, system engineer in Zurich: semester projects from the Dipl. Informatiker HF studies, CV and own projects on automation, cloud and AI."
          nav_translations:
            Start: Home
            Projekte: Projects
            Lebenslauf: CV
          theme:
            palette:
              - toggle:
                  name: Switch to dark mode
              - toggle:
                  name: Switch to light mode

# Rendert die Projektkarten aus data/projects.yml und die Kontaktlinks (siehe README).
hooks:
  - hooks/projects.py

validation:
  links:
    anchors: warn

# Hauptnavigation in der Kopfzeile (Start erscheint dort als Name links)
nav:
  - Start: index.md
  - Projekte: projekte.md
  - Lebenslauf: cv.md
