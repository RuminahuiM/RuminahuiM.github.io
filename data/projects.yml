# Projektliste der Portfolio-Seite.
# Ein neues Projekt = ein neuer Eintrag unter "projects". Reihenfolge egal,
# die Seite sortiert automatisch nach "start" (neueste zuerst).
# Anleitung und Feldbeschreibung: README.md, Abschnitt "Neues Projekt hinzufügen".
# Englische Fassung: Block "en:" mit den übersetzten Feldern (title, summary,
# topics, status, image_alt). Fehlt ein Feld, erscheint auf Englisch der deutsche Text.

categories:
  - id: semesterarbeiten
    title: Semesterarbeiten
    page: semesterarbeiten.md
    en:
      title: Semester projects
  - id: weitere-projekte
    title: Weitere Projekte
    page: weitere-projekte.md
    en:
      title: Other projects

projects:
  - title: RDG als DevOps-Projekt mit KI-Wartung
    category: semesterarbeiten
    semester: 4
    topics: [Projektmanagement, DevOps, CI/CD, AI, Microsoft 365]
    start: "2026-08"
    end: "2027-01"
    status: laufend
    summary: >
      RDG pflegt Gruppen in Microsoft 365 nach Regeln. In dieser Arbeit wird daraus ein
      sauberes DevOps-Projekt mit Tests, automatischem Deployment und manueller
      Release-Freigabe. Danach teste und bewerte ich, wie gut ein KI-Agent die Wartung übernehmen kann.
    page: https://ruminahuim.github.io/rdg-semesterarbeit/
    repo: https://github.com/RuminahuiM/rdg-semesterarbeit
    product: https://github.com/RuminahuiM/rdg
    en:
      title: RDG as a DevOps project with AI maintenance
      topics: [Project management, DevOps, CI/CD, AI, Microsoft 365]
      status: ongoing
      summary: >
        RDG maintains groups in Microsoft 365 based on rules. In this project I turn it into
        a clean DevOps project with tests, automated deployment and manual release approval.
        Then I test and evaluate how well an AI agent can take over maintenance.

  - title: Implementing Post-Quantum Cryptography in a Python Authentication Service
    category: semesterarbeiten
    semester: 3
    topics: [Security, Post-Quantum-Kryptografie, Python, FastAPI, React Native, Docker]
    start: "2026-02"
    end: "2026-07"
    summary: >
      Ein Authentifizierungs-Service in Python, der die neuen NIST-Standards für
      Post-Quanten-Kryptografie praktisch einsetzt: hybrides PQ-TLS, eine PQ-Sitzungsschicht
      und ML-DSA-signierte Tokens. Logins über Google und Microsoft werden per Identity
      Broker in eine PQ-sichere Session überführt.
    page: https://ruminahuim.github.io/rib-pqc-semesterarbeit/
    repo: https://github.com/RuminahuiM/rib-pqc-semesterarbeit
    product: https://github.com/RuminahuiM/rib-pqc
    en:
      topics: [Security, Post-quantum cryptography, Python, FastAPI, React Native, Docker]
      summary: >
        An authentication service in Python that puts the new NIST standards for
        post-quantum cryptography into practice: hybrid PQ TLS, a PQ session layer and
        ML-DSA signed tokens. Logins via Google and Microsoft are turned into a PQ-secure
        session by an identity broker.

  - title: Automatisiertes Hugo Portfolio
    category: semesterarbeiten
    semester: 2
    topics: [AWS, Ansible, IaC, CI/CD, Hugo]
    start: "2025-08"
    end: "2026-01"
    summary: >
      Eine statische Portfolio-Website mit Hugo auf AWS. Die Infrastruktur mit S3,
      CloudFront und HTTPS wird mit Ansible aufgebaut, jede Änderung geht per
      GitHub Actions automatisch online.
    page: https://ruminahuim.github.io/hugo-portfolio-semesterarbeit/
    repo: https://github.com/RuminahuiM/hugo-portfolio-semesterarbeit
    product: https://github.com/RuminahuiM/hugo-portfolio-setup
    en:
      title: Automated Hugo portfolio
      summary: >
        A static portfolio website built with Hugo on AWS. The infrastructure with S3,
        CloudFront and HTTPS is set up with Ansible, and every change goes live
        automatically via GitHub Actions.

  - title: "Azure Dynamic Groups: Access Governance Concept"
    category: semesterarbeiten
    semester: 1
    topics: [Azure, Microsoft 365, PowerShell, Automatisierung, Access Governance]
    start: "2025-02"
    end: "2025-07"
    summary: >
      Konzept und Proof of Concept für automatische Berechtigungen und Mailverteiler
      über dynamische Gruppen in Microsoft Entra ID. Umgesetzt mit PowerShell-Runbooks,
      Logic Apps und einer zentralen Abteilungsliste als Datenquelle.
    page: https://ruminahuim.github.io/azure-dynamic-groups-semesterarbeit/
    repo: https://github.com/RuminahuiM/azure-dynamic-groups-semesterarbeit
    en:
      topics: [Azure, Microsoft 365, PowerShell, Automation, Access governance]
      summary: >
        Concept and proof of concept for automatic permissions and mailing lists using
        dynamic groups in Microsoft Entra ID. Built with PowerShell runbooks, Logic Apps
        and a central department list as the data source.

  - title: Rumis AI Lab
    category: weitere-projekte
    topics: [AI, LLM, Docker, AWS, Self-Hosting, CI/CD]
    start: "2026-03"
    summary: >
      Eine modulare AI-Umgebung mit Docker Compose: Open WebUI als Chat-Oberfläche,
      OpenClaw als autonomer Agent, LiteLLM als Proxy für Claude, GPT und Gemini sowie
      lokale Modelle über Ollama und llama.cpp. Läuft lokal, auf einem eigenen Server
      oder per GitHub Actions automatisch auf AWS EC2 mit HTTPS über Let's Encrypt.
    repo: https://github.com/RuminahuiM/Rumis-AI-Lab
    en:
      summary: >
        A modular AI environment with Docker Compose: Open WebUI as the chat interface,
        OpenClaw as an autonomous agent, LiteLLM as a proxy for Claude, GPT and Gemini, and
        local models via Ollama and llama.cpp. Runs locally, on your own server or
        automatically on AWS EC2 via GitHub Actions, with HTTPS through Let's Encrypt.

