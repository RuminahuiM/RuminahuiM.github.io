name: screenshot (temporaer)
on:
  push:
    branches: [tmp-screenshot]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p check
          curl -sSfL -o check/cv-de.pdf https://ruminahuim.github.io/downloads/lebenslauf-dodoe-mannale.pdf
          curl -sSfL -o check/cv-en.pdf https://ruminahuim.github.io/en/downloads/cv-dodoe-mannale.pdf
          curl -sSfL -o check/rdg.pdf https://ruminahuim.github.io/rdg-semesterarbeit/downloads/rdg-semesterarbeit-gesamtdokument.pdf
          curl -sSfL -o check/rdg.md https://ruminahuim.github.io/rdg-semesterarbeit/downloads/rdg-semesterarbeit-gesamtdokument.md
          curl -sSI https://ruminahuim.github.io/rdg-semesterarbeit/downloads/rdg-semesterarbeit-gesamtdokument.md | grep -i content-type > check/md-headers.txt
          curl -sSfL -o check/en-index.html https://ruminahuim.github.io/en/
          ls -la check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add check
          git commit -m "Live-Check PDFs"
          git push origin HEAD:tmp-screenshot
