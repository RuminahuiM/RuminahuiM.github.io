name: screenshot (temporaer)
on:
  push:
    branches: [tmp-screenshot]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(viewport={"width": 1600, "height": 1000})
                  await pg.goto("https://elpastelazo.ch/", wait_until="networkidle", timeout=60000)
                  await pg.wait_for_timeout(2500)
                  await pg.screenshot(path="elpastelazo.png")
                  pg2 = await b.new_page(viewport={"width": 390, "height": 844}, device_scale_factor=2)
                  await pg2.goto("https://elpastelazo.ch/", wait_until="networkidle", timeout=60000)
                  await pg2.wait_for_timeout(2500)
                  await pg2.screenshot(path="elpastelazo-mobile.png")
                  await b.close()
          asyncio.run(main())
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add elpastelazo.png elpastelazo-mobile.png
          git commit -m "Screenshot elpastelazo.ch"
          git push origin HEAD:tmp-screenshot
